name: 高配当株データ更新

on:
  schedule:
    - cron: "0 22 * * 5"   # 毎週土曜 7:00 JST（金曜引け後）
  workflow_dispatch:        # 「Run workflow」ボタンで手動実行（ワンクリック）

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: 財務キャッシュを復元
        uses: actions/cache/restore@v5
        with:
          path: cache
          key: fin-cache-${{ github.run_id }}
          restore-keys: fin-cache-

      - run: pip install -r requirements.txt

      - name: データ収集とスクリーニング
        timeout-minutes: 300
        env:
          UNIVERSE_LIMIT: ${{ vars.UNIVERSE_LIMIT }}
          COUNTRIES: "JP,US"
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: python screen.py

      - name: 財務キャッシュを保存（途中で止まっても、集めた分は次回に使う）
        if: always()
        uses: actions/cache/save@v5
        with:
          path: cache
          key: fin-cache-${{ github.run_id }}

      - name: 結果をコミット
        run: |
          git config user.name "screener-bot"
          git config user.email "bot@users.noreply.github.com"
          for f in data.json docs/data.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet && exit 0
          git commit -m "data: $(date -u +'%Y-%m-%d')"
          git pull --rebase origin ${{ github.ref_name }}
          git push
